on:
  push:
    branches:
      - 'main'

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Call deploy endpoint
      env:
        token: ${{ secrets.DEPLOY_KEY }}
      run: |
        url=https://lcruz.dev/flask/deploy/luiscruzgmu
        id=$(curl -fsS "$url" -H "Authorization: $token" | jq -r .id)
        [ -n "$id" ] || { echo "failed to start the deploy"; exit 1; }
        # the deploy runs detached on the server; poll its log so a dropped connection doesn't fail the job
        offset=0
        failures=0
        while :; do
          if ! res=$(curl -fsS --max-time 30 "$url/log?id=$id&offset=$offset" -H "Authorization: $token"); then
            failures=$((failures + 1))
            [ $failures -ge 20 ] && { echo "lost contact with the deploy"; exit 1; }
            sleep 5
            continue
          fi
          failures=0
          jq -j .text <<<"$res"
          offset=$(jq .offset <<<"$res")
          code=$(jq .exit_code <<<"$res")
          [ "$code" != null ] && break
          sleep 3
        done
        [ "$code" = 0 ] || { echo "Deployment failed with exit code $code"; exit 1; }
        echo "Deployment completed successfully"
